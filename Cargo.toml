[package]
name = "claude-guard"
version = "3.12.5"
edition = "2021"
license = "MIT"
description = "ClaudeGuard：Windows AI 桌面应用网络出口门禁（多目标锚点 + 熔断断网）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
ureq = "2"
sysinfo = "0.30"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication"] }
aes-gcm = "0.10"
plist = "1"
libc = "0.2"
libloading = "0.8"
tempfile = "3"
# RUSTSEC-2026-0367/0369 的修补版本是 9.0.0，2.x 没有修补版；本项目只用 zip 读条目
# 元数据（解压走系统 ditto），升级面因此只在元数据 API 上。
zip = { version = "9", default-features = false, features = ["deflate"] }
# RUSTSEC-2026-0194/0195 修补于 0.41；这里取 0.42 是为了和 plist 的解析版本对齐，
# 代价是 local_name() 返回 &str 而非裸字节（src/macos/claude_update.rs 已跟着改）。
quick-xml = { version = "0.42", features = ["serialize"] }
url = "2"
minisign-verify = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
minisign = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
