<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeGuard</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-overall="idle" data-ready="0">

<header class="titlebar" data-tauri-drag-region>
  <div class="brand" data-tauri-drag-region>
    <span class="brand-name" data-tauri-drag-region>ClaudeGuard</span>
  </div>
  <div class="winbtns">
    <button class="winbtn" id="btn-min" type="button" aria-label="最小化" title="最小化">
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="winbtn winbtn-close" id="btn-close" type="button" aria-label="关闭" title="关闭">
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main class="scroll" id="scroll">
  <div class="content" id="content">

    <section class="hero" id="hero" aria-label="守护状态">
      <div class="ring" id="ring">
        <svg class="ring-svg" viewBox="0 0 118 118" aria-hidden="true">
          <defs>
            <linearGradient id="ring-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34C759"/><stop offset="1" stop-color="#03AA49"/></linearGradient>
            <linearGradient id="ring-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF3B47"/><stop offset="1" stop-color="#E4002B"/></linearGradient>
            <linearGradient id="ring-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F0A"/><stop offset="1" stop-color="#ED6300"/></linearGradient>
            <linearGradient id="ring-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A84FF"/><stop offset="1" stop-color="#0071E3"/></linearGradient>
            <linearGradient id="ring-gray" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D2D2D7"/><stop offset="1" stop-color="#AEAEB2"/></linearGradient>
          </defs>
          <g transform="rotate(-90 59 59)">
            <circle class="ring-track" cx="59" cy="59" r="54" fill="none" stroke="#E9E9EE" stroke-width="5.6"/>
            <circle class="ring-fg" id="ring-fg" cx="59" cy="59" r="54" fill="none" stroke="#03AA49" stroke-width="5.6" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/>
          </g>
          <circle class="ring-spinner" id="ring-spinner" cx="59" cy="59" r="54" fill="none" stroke="url(#ring-blue)" stroke-width="5.6" stroke-linecap="round" stroke-dasharray="72 267.3" hidden/>
        </svg>
        <div class="core" id="hero-core" aria-hidden="true"></div>
      </div>
      <h1 class="hero-title" id="hero-title">守护待命</h1>
      <div class="hero-sub" id="hero-sub">等待首次检测</div>
    </section>

    <div class="banners" id="banners" aria-live="polite"></div>

    <section class="egress" id="targets" aria-label="出口校验"></section>

    <div class="cta">
      <button class="btn-primary" id="btn-primary" type="button"></button>
      <div class="cta-links">
        <button class="link-action" id="btn-recheck" type="button"></button>
        <button class="link-action" id="btn-sweep" type="button"></button>
      </div>
    </div>

    <section class="card fold" id="card-details" data-card="details">
      <button class="fold-head" id="head-details" type="button" aria-expanded="false" aria-controls="body-details">
        <span class="fold-title">详情</span>
        <span class="fold-sub" id="details-sub"></span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="fold-body" id="body-details" hidden></div>
    </section>

    <section class="card fold" id="card-settings" data-card="settings">
      <button class="fold-head" id="head-settings" type="button" aria-expanded="false" aria-controls="body-settings">
        <span class="fold-title">设置</span>
        <span class="fold-sub" id="settings-sub">检测 · 熔断与清理 · 目标 · 通知 · 更新</span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="fold-body" id="body-settings" hidden></div>
    </section>

    <section class="card fold" id="card-logs" data-card="logs">
      <button class="fold-head" id="head-logs" type="button" aria-expanded="false" aria-controls="body-logs">
        <span class="fold-title">日志</span>
        <span class="fold-sub" id="logs-sub"></span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="fold-body log" id="body-logs" hidden>
        <div class="log-lines" id="log-lines"></div>
      </div>
    </section>

  </div>
</main>

<footer class="footer">
  <div class="links">
    <button class="link" id="link-details" type="button">详情</button>
    <button class="link" id="link-settings" type="button">设置</button>
    <button class="link" id="link-logs" type="button">日志</button>
  </div>
  <div class="foot-right">
    <span class="foot-version" id="foot-version">v3.1.0</span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="wizard" id="wizard" role="dialog" aria-modal="true" aria-labelledby="wiz-title" hidden>
  <div class="wizard-card">
    <div class="wiz-dots" id="wiz-dots" aria-hidden="true"><span></span><span></span><span></span></div>

    <section class="wiz-page is-on" data-step="0">
      <div class="wiz-mark" aria-hidden="true"></div>
      <h2 class="wiz-title" id="wiz-title">欢迎使用 ClaudeGuard</h2>
      <p class="wiz-p">它在后台持续校验你的出口 IP。一旦不符合白名单就立即熔断：结束相关应用并切断网络，避免请求带着真实 IP 泄露。</p>
      <ul class="wiz-list">
        <li>全部本地运行，不上传任何数据。</li>
        <li>检测地址与白名单都可以在设置里随时修改。</li>
      </ul>
    </section>

    <section class="wiz-page" data-step="1">
      <h2 class="wiz-title">代理与白名单</h2>
      <p class="wiz-p">填写本机代理端口，以及允许的出口 IP。留空则保持当前配置。</p>
      <label class="wiz-field"><span>代理端口</span><input class="in" id="wiz-port" type="number" min="1" max="65535" step="1" inputmode="numeric" placeholder="7890"></label>
      <label class="wiz-field"><span>白名单 IP</span><input class="in" id="wiz-ips" type="text" placeholder="204.1.100.98, 198.51.100.7"></label>
      <label class="wiz-field"><span>出口地区</span>
        <select class="in" id="wiz-region">
          <option value="">不限</option>
          <option value="US">美国</option>
          <option value="JP">日本</option>
          <option value="SG">新加坡</option>
          <option value="HK">香港</option>
          <option value="TW">台湾</option>
          <option value="KR">韩国</option>
          <option value="GB">英国</option>
          <option value="DE">德国</option>
          <option value="FR">法国</option>
          <option value="CA">加拿大</option>
          <option value="AU">澳大利亚</option>
        </select>
      </label>
      <p class="wiz-hint">白名单会写入「本机出口 / Claude 出口 / Codex 出口」三个内置目标。</p>
    </section>

    <section class="wiz-page" data-step="2">
      <h2 class="wiz-title">安装方式</h2>
      <p class="wiz-p">安装版会注册开始菜单与开机自启；便携版直接在当前目录运行。</p>
      <div class="wiz-choices">
        <button class="wiz-choice" id="wiz-install" type="button">
          <strong>安装并继续</strong>
          <span>推荐。注册开始菜单，可随 Windows 启动。</span>
        </button>
        <button class="wiz-choice" id="wiz-portable" type="button">
          <strong>使用便携版</strong>
          <span>不写注册表，直接运行当前目录的 ClaudeGuard。</span>
        </button>
      </div>
      <p class="wiz-hint" id="wiz-install-note" hidden></p>
    </section>

    <div class="wiz-err" id="wiz-err" role="alert" hidden></div>

    <div class="wiz-nav">
      <button class="wiz-skip" id="wiz-skip" type="button">以后再说</button>
      <div class="wiz-nav-right">
        <button class="wiz-prev" id="wiz-prev" type="button" hidden>上一步</button>
        <button class="wiz-next" id="wiz-next" type="button">开始</button>
      </div>
    </div>
  </div>
</div>

<script src="ipc.js"></script>
<script src="icons.js"></script>
<script src="main.js"></script>
<script src="settings.js"></script>
<script src="updates.js"></script>
<script src="feishu.js"></script>
</body>
</html>
