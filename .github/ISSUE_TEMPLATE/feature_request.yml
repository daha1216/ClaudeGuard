name: 功能建议
description: 提出新功能、防护增强或体验改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述使用场景与痛点。
      placeholder: 例如：希望自定义某类 MCP 子进程的雷达白名单……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 功能生效时界面表现、守护策略与恢复语义。
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 涉及模块
      options:
        - 守护服务与策略评估（cg-core / cg-daemon）
        - Windows 平台驱动（cg-platform：防火墙 / 探测 / 注入）
        - 原生 GPUI 桌面界面（cg-gui）
        - 命令行工具（claudeguard-cli）
        - 文档与安装器
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充材料（可选）
      description: 截图、复现步骤或参考仓库链接。
