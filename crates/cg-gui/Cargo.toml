[package]
name = "cg-gui"
version = "4.0.1"
edition = "2024"
resolver = "2"
rust-version = "1.98.1"
publish = false
license = "Apache-2.0"
description = "ClaudeGuard v4 native GPUI console and tray HUD"

[workspace]

[[bin]]
name = "claudeguard-gui"
path = "src/main.rs"

[dependencies]
cg-protocol = { path = "../cg-protocol" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", package = "gpui", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", package = "gpui_platform", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
